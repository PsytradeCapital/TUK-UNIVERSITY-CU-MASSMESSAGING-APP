name: tuk_cu_mass_messaging_app
description: TUK CU Mass Messaging App - Technical University of Kenya Christian Union mass messaging and attendance system. "Raising to Serve"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.9
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # SMS functionality
  telephony: ^0.2.0
  
  # State management
  provider: ^6.1.1
  
  # Security and encryption
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.6
  
  # File system access
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # CSV export and sharing
  csv: ^5.0.2
  share_plus: ^7.2.1
  
  # File picker
  file_picker: ^6.1.1
  
  # Network connectivity
  connectivity_plus: ^5.0.2
  
  # Document scanning and OCR
  image_picker: ^1.0.4
  google_mlkit_text_recognition: ^0.10.0
  image: ^4.1.3
  file_picker: ^6.1.1
  pdf_text: ^0.4.0
  
  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/cu_logo_new_dark.png
    - assets/cu_logo_new_light.png